# InkShader 后端包定义 —— 依赖与工具配置的唯一来源。
#
#   [project.dependencies]          运行依赖（下限；精确版本见 requirements.lock.txt）
#   [project.optional-dependencies] 分组依赖：build / test / lint
#
# 安装：
#   pip install -e ./backend                 运行依赖
#   pip install -e "./backend[build]"        打包（pyinstaller）
#   pip install -e "./backend[test,lint]"    测试 + 静态检查
#   pip install -r backend/requirements.lock.txt   按已验证的精确版本安装
#
# 不再维护并行的 requirements.txt / requirements-build.txt —— 它们曾与这里
# 手工保持一致，必然漂移。lock 文件只由 pyproject 的依赖生成。
#
# 版本号仅用于 Python 包元数据；打包产物内的版本以 build.py 的 VERSION 为准
# （写入 _build_info_generated.py）。

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inkshader"
version = "0.1.0"
description = "InkShader local backend: font compilation/export services and desktop shell"
requires-python = ">=3.11"

dependencies = [
    # 字体管线
    "fonttools>=4.61.1",
    "ufo2ft>=3.7.0",
    "ufoLib2>=0.18.1",
    "booleanOperations>=0.9.0",
    "brotli>=1.2.0",
    "skia-pathops>=0.9.2",
    # API 服务
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
    "python-multipart>=0.0.32",
    # 桌面壳（仅 desktop 模式导入；web 控制台后端不用，且打包时被排除）
    "pywebview>=6.2.1",
]

[project.optional-dependencies]
# Pillow 仅用于构建期生成 .ico（desktop/icons.py 的 save_icon_ico），
# 运行期两个模式都不导入它。
build = ["pyinstaller>=6.22.2", "Pillow>=10.0.0"]
test = ["pytest>=8.0"]
lint = ["ruff>=0.6"]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["inkshader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120
# 只启用「一定是错误」的规则子集：本仓库先前没有静态检查，
# 一次性打开全部规则会产生大量与真实缺陷无关的噪声。
lint.select = ["E4", "E7", "E9", "F"]
